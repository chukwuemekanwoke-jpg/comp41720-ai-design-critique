openapi: 3.0.3
info: {title: StudentPath shared HTTP schemas, version: 1.2.0}
paths: {}
components:
  parameters:
    RequestId:
      in: header
      name: X-Request-ID
      description: Gateway validates or assigns this ID and propagates it downstream.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
  headers:
    RequestId:
      description: Matches request_id in the JSON response.
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
  schemas:
    Error:
      type: object
      required: [request_id, error, message]
      properties:
        request_id: {type: string}
        error: {type: string}
        message: {type: string}
    Source:
      type: object
      additionalProperties: false
      required: [source_id, snapshot_id, source_version, url, passage]
      properties:
        source_id: {type: string, minLength: 1, maxLength: 256}
        snapshot_id: {type: string, minLength: 1, maxLength: 256}
        source_version: {type: integer, minimum: 1}
        url: {type: string, format: uri, maxLength: 2048, description: Canonical HTTP(S) URL; never supplied by the model.}
        passage: {type: string, minLength: 1, maxLength: 4000}
    ModelInfo:
      type: object
      additionalProperties: false
      required: [name, prompt_version]
      properties:
        name: {type: string}
        prompt_version: {type: string}
    PendingSource:
      type: object
      additionalProperties: false
      required: [source_id, indexed_source_version, latest_source_version, detected_at]
      description: >-
        Gateway-supplied version facts. latest_source_version must exceed
        indexed_source_version. detected_at is required but may be null when unknown;
        nonnull values must include a timezone. Source IDs must not be blank.
      properties:
        source_id: {type: string, minLength: 1, maxLength: 256}
        indexed_source_version: {type: integer, minimum: 1}
        latest_source_version: {type: integer, minimum: 1}
        detected_at: {type: string, format: date-time, nullable: true, maxLength: 64}
    AffectedSourceDetail:
      type: object
      additionalProperties: false
      required: [source_id, indexed_source_version, latest_source_version, detected_at, url]
      description: >-
        PendingSource version rules apply. URL is copied from the supplied evidence,
        never generated by the model. Repeated fields keep the closed object compatible
        with OpenAPI 3.0 validators.
      properties:
        source_id: {type: string, minLength: 1, maxLength: 256}
        indexed_source_version: {type: integer, minimum: 1}
        latest_source_version: {type: integer, minimum: 1}
        detected_at: {type: string, format: date-time, nullable: true, maxLength: 64}
        url: {type: string, format: uri, minLength: 1, maxLength: 2048, description: Canonical HTTP(S) URL without whitespace.}
    Answer:
      type: object
      required: [request_id, status, answer, checklist, sources, index_version, last_success_at, fallback_used, model, notice]
      description: >-
        answered requires a nonblank answer and supplied citations.
        insufficient_evidence requires null answer, empty sources/checklist and fallback_used=false.
        degraded requires null answer, retained evidence, empty checklist and fallback_used=true.
        Nonempty evidence requires a timezone-aware last_success_at.
        When abstention is present, status is insufficient_evidence, model.name is
        policy-response and model.prompt_version is none. Answer omits abstention
        on normal responses; Gateway may expose it as null in its public response.
        Enforce these cross-field rules at runtime in addition to schema validation.
      properties:
        request_id: {type: string}
        status: {type: string, enum: [answered, insufficient_evidence, degraded]}
        answer: {type: string, nullable: true}
        checklist: {type: array, items: {type: string}}
        sources:
          type: array
          items: {$ref: '#/components/schemas/Source'}
        index_version: {type: string}
        last_success_at: {type: string, format: date-time, nullable: true}
        fallback_used: {type: boolean}
        model: {$ref: '#/components/schemas/ModelInfo'}
        notice: {type: string}
        abstention:
          type: object
          nullable: true
          additionalProperties: false
          required: [reason, message, affected_sources]
          properties:
            reason: {type: string, enum: [pending_source_update]}
            message:
              type: string
              enum:
                - One or more sources used for this question have changed and the saved information has not been updated yet. Check the linked official sources or try again shortly.
            affected_sources:
              type: array
              minItems: 1
              maxItems: 10
              description: Unique source IDs; retain supplied versions and detection dates.
              items: {$ref: '#/components/schemas/AffectedSourceDetail'}
        refusal_reason:
          type: string
          enum: [instruction_override]
          description: >-
            Optional. Present only on an insufficient_evidence refusal made by the
            instruction guard (#29); omitted otherwise and never combined with abstention.
            Agreed on #29; the Gateway accepts it before the Answer service sends it.
        stub: {type: boolean, description: Present only in the existing placeholder Gateway; frontend must label it.}
    Job:
      type: object
      additionalProperties: false
      required: [job_id, policy_id, status, submitted_at, updated_at, source_id, snapshot_id, index_version, failure]
      properties:
        job_id: {type: string}
        policy_id: {type: string}
        status: {type: string, enum: [pending_review, queued, processing, indexed, failed, rejected]}
        submitted_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        source_id: {type: string, nullable: true}
        snapshot_id: {type: string, nullable: true}
        index_version: {type: string, nullable: true, description: Set only after committed index activation.}
        failure:
          type: object
          nullable: true
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string, description: Sanitised message without stack traces.}
            retryable: {type: boolean}
    Upload:
      type: object
      required: [file, title, source_url]
      properties:
        file:
          type: string
          format: binary
          description: Nonempty PDF, UTF-8 TXT or HTML; maximum 10 MiB. Validate bytes and extraction server-side.
        title: {type: string, minLength: 1, maxLength: 150}
        source_url: {type: string, format: uri, description: HTTPS irishimmigration.ie or subdomain; authenticity requires review.}
        effective_date: {type: string, format: date, description: Optional; not collection freshness.}
  responses:
    Error:
      description: Error code and safe message; request ID retained.
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
