# Full StudentPath stack: `docker compose up -d` from the repository root.
# The project name is kept from the former compose.check.yaml so existing volumes stay attached.
name: studentpath-check
x-python: &python
  image: studentpath-check:local
  build:
    context: .
    dockerfile: Dockerfile.check
  init: true
services:
  rabbitmq:
    image: rabbitmq:4-management
    # RabbitMQ stores data under its node name, which comes from the hostname.
    # A fixed hostname lets a recreated container reuse the volume's queues.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: check
      RABBITMQ_DEFAULT_PASS: local-check-only
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_port_connectivity]
      interval: 5s
      timeout: 5s
      retries: 20
  seed:
    <<: *python
    # Compose re-runs this one-shot service whenever a dependent starts (for example
    # `docker compose start indexer`). Seeding again would reset a changed fixture
    # mid-demonstration, so only seed an empty store unless SEED_FORCE=1 is set.
    command:
      - sh
      - -c
      - >-
        if [ -f /state/collector.sqlite3 ] && [ "$${SEED_FORCE:-0}" != 1 ]; then
        echo 'Collector store exists; skipping seed (set SEED_FORCE=1 to re-collect the fixture).';
        else exec python -m source_collector --manifest docker-check/manifest.json
        --db /state/collector.sqlite3 --fixture-dir docker-check; fi
    environment:
      SEED_FORCE: ${SEED_FORCE:-0}
    volumes: [collector:/state]
  collector:
    <<: *python
    command: [python, -m, uvicorn, source_collector.snapshot_api:app, --host, 0.0.0.0, --port, '8001']
    environment:
      COLLECTOR_DB: /state/collector.sqlite3
    volumes: [collector:/state]
    depends_on:
      seed: {condition: service_completed_successfully}
  retrieval:
    <<: *python
    command: [python, -m, uvicorn, retrieval_api.app:app, --host, 0.0.0.0, --port, '8002']
    environment:
      RETRIEVAL_INDEX_DB: /index/indexer.sqlite3
      # ADR-0003: poll Collector source status so questions on a source with a
      # detected but unindexed change abstain instead of serving stale guidance.
      COLLECTOR_BASE_URL: http://collector:8001
    volumes: [index:/index:ro]
    depends_on:
      collector: {condition: service_started}
  indexer:
    <<: *python
    command: [python, -m, indexing_worker.consumer]
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://check:local-check-only@rabbitmq:5672/%2F
      RABBITMQ_QUEUE: studentpath.local.updates
      INDEXER_DB: /index/indexer.sqlite3
      COLLECTOR_BASE_URL: http://collector:8001
    volumes: [index:/index]
    depends_on:
      rabbitmq: {condition: service_healthy}
      collector: {condition: service_started}
  relay:
    <<: *python
    command: [python, -m, source_collector.relay]
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://check:local-check-only@rabbitmq:5672/%2F
      RABBITMQ_QUEUE: studentpath.local.updates
      COLLECTOR_DB: /state/collector.sqlite3
      RELAY_RETRY_SECONDS: '2'
    volumes: [collector:/state]
    depends_on:
      rabbitmq: {condition: service_healthy}
      seed: {condition: service_completed_successfully}
  retrieval-demo:
    <<: *python
    command: [python, -m, uvicorn, retrieval_api.app:create_demo_app, --factory, --host, 0.0.0.0, --port, '8002']
  answer:
    <<: *python
    command: [python, -m, uvicorn, answer_service.app:app, --host, 0.0.0.0, --port, '8003']
    # Evidence-only by default: runs offline with no model (ADR-0004 fallback).
    # To use an Ollama running on this machine, set in .env or the shell:
    #   ANSWER_GENERATION_MODE=ollama  OLLAMA_MODEL=<an installed model, e.g. llama3.2:1b>
    environment:
      ANSWER_GENERATION_MODE: ${ANSWER_GENERATION_MODE:-evidence_only}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-20}
    # host.docker.internal is built in on Docker Desktop; this also makes it work on Linux.
    extra_hosts: ["host.docker.internal:host-gateway"]
  gateway:
    <<: *python
    command: [python, -m, uvicorn, gateway.app:app, --host, 0.0.0.0, --port, '8000']
    environment:
      RETRIEVAL_BASE_URL: http://retrieval:8002
      ANSWER_BASE_URL: http://answer:8003
    depends_on: [retrieval, answer]
  gateway-demo:
    <<: *python
    command: [python, -m, uvicorn, gateway.app:app, --host, 0.0.0.0, --port, '8000']
    environment:
      RETRIEVAL_BASE_URL: http://retrieval-demo:8002
      ANSWER_BASE_URL: http://answer:8003
    depends_on: [retrieval-demo, answer]
  web:
    image: nginx:alpine
    ports: ['127.0.0.1:8088:80']
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker-check/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [gateway, gateway-demo]
  tests:
    <<: *python
    profiles: [checks]
    environment:
      RABBITMQ_INTEGRATION_URL: amqp://check:local-check-only@rabbitmq:5672/%2F
    command: [python, -m, pytest, -q, --junitxml=/results/pytest.xml]
    volumes: [./docker-check-results:/results]
    depends_on:
      rabbitmq: {condition: service_healthy}
  product-check:
    <<: *python
    profiles: [checks]
    environment:
      RABBITMQ_URL: amqp://check:local-check-only@rabbitmq:5672/%2F
    command: [python, docker-check/check_product.py]
    volumes:
      - ./docker-check:/app/docker-check:ro
      - collector:/state
      - ./docker-check-results:/results
    depends_on:
      rabbitmq: {condition: service_healthy}
      collector: {condition: service_started}
      web: {condition: service_started}
volumes:
  collector:
  index:
  rabbitmq:
