name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, frontend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  contracts:
    name: API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - run: python -m pip install -r requirements-contracts.txt
      - run: python scripts/validate_contracts.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/check_frontend.mjs
      - name: Package reviewed frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  rabbitmq:
    name: RabbitMQ integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-ephemeral-test-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_rabbitmq_integration.py
        env:
          RABBITMQ_INTEGRATION_URL: amqp://ci:ci-ephemeral-test-password@127.0.0.1:5672/%2F

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [python, contracts, frontend, rabbitmq]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to succeed
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RABBITMQ_RESULT: ${{ needs.rabbitmq.result }}
        run: |
          for result in "$PYTHON_RESULT" "$CONTRACTS_RESULT" "$FRONTEND_RESULT" "$RABBITMQ_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required job failed, was cancelled, or was skipped."
              exit 1
            fi
          done
