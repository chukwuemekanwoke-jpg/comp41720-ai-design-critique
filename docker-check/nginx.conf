server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri $uri/ /index.html; }
  location /v1/ { proxy_pass http://gateway:8000; }
  location /healthz { proxy_pass http://gateway:8000; }
  location /readyz { proxy_pass http://gateway:8000; }
  location /demo/ { proxy_pass http://gateway-demo:8000/; }
}
